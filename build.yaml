overview: "Adds a comment section to your media library."
description: >
  A self-hosted comment section for your Jellyfin media. Signed-in users can post,
  reply, edit, delete and react to comments, including timestamped comments tied to
  a specific playback position. Data lives in its own SQLite database alongside the
  server data directory, never in Jellyfin's main database.
